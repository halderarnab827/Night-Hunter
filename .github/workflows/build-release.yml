name: Build Night Hunter downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build dashboard files
        run: |
          npm ci
          npm run build
          New-Item -ItemType Directory -Force frontend | Out-Null
          Move-Item dist frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows dashboard executable
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirement.txt
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name NightHunter --add-data "api;api" --add-data "core;core" --add-data "modules;modules" --add-data "utils;utils" --add-data "frontend/dist;frontend/dist" desktop_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-download
          path: dist/NightHunter.exe

  linux-and-termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux and Termux archives
        run: |
          chmod +x build-linux-package.sh build-termux-package.sh
          ./build-linux-package.sh
          ./build-termux-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: terminal-downloads
          path: |
            releases/night-hunter-linux.tar.gz
            releases/night-hunter-termux.zip

  release:
    needs: [windows, linux-and-termux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release-files/windows-download/NightHunter.exe release-files/terminal-downloads/night-hunter-linux.tar.gz release-files/terminal-downloads/night-hunter-termux.zip --title "Night Hunter $TAG" --generate-notes
